<style>
body{margin:0;background:#F4F5F7;color:#16181D;font-family:'Hanken Grotesk','Helvetica Neue',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#16181D;text-decoration:none}a:hover{color:#A8661A}
@keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rec-dot{animation:rec-pulse 1.6s ease-in-out infinite}
@keyframes la-wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.la-wave{transform-origin:center;animation:la-wave 1.1s ease-in-out infinite}
@keyframes la-halo{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}

  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;">

      <div style="font-family: 'Newsreader', Georgia, serif; font-weight: 300; font-size: 104px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: #16181D;">04:12</div>

      <sc-for list="{{bars}}" as="b" hint-placeholder-count="44">

      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: #656A73;">
      <span>4 fragmenti nosūtīti</span>
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #C9CDD4; display: inline-block;"></span>
      <span>LV + EN</span>
    </div>
  </div>

  <div style="position: relative; display: flex; gap: 12px;">
    <button type="button" style="flex: 1 1 0; height: 64px; border-radius: 32px; background: #FFFFFF; border: 1px solid #E1E4E9; color: #16181D; font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>Pauzēt</button>

</div>
