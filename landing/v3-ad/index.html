<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Recap — Record once. Remember everything.</title>
<meta name="description" content="AI Recap records meetings, transcribes them and writes a structured recap. Built for Latvian and English. iPhone + Apple Watch.">
<link rel="icon" href="assets/icon-180.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<script>
/* language + theme before first paint */
(function () {
  var q = new URLSearchParams(location.search), d = document.documentElement, ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var lang = q.get("lang") || ls("airecap-lang") || ((navigator.language || "en").toLowerCase().indexOf("lv") === 0 ? "lv" : "en");
  d.lang = lang === "lv" ? "lv" : "en";
  var th = q.get("theme") || ls("airecap-theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  d.setAttribute("data-theme", th === "dark" ? "dark" : "light");
  d.className = "js";
})();
</script>
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#EAECF0;--line:#E1E4E9;--text:#16181D;--text2:#656A73;--text3:#8A8F98;
  --accent:#E9A24A;--accentText:#A8661A;--accentTint:#FBEFDC;--record:#E0432F;--btn:#16181D;--btnText:#FFFFFF;
  --blue:#3A6E9A;--blueTint:rgba(58,110,154,.12);--dead:#C4372A;--shadow:0 8px 24px rgba(22,24,29,.06);--shadowL:0 30px 80px rgba(22,24,29,.16);
  /* "film" bands are the ad's dark scenes — dark in both themes */
  --film:#15171B;--filmSurface:#1D2025;--filmLine:#2E333A;--filmText:#F1EDE6;--filmText2:#A6A29B;--filmText3:#86827B;--filmRed:#F2543F;--filmBlue:#8FB7D6;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--pad:clamp(16px,4vw,40px);
}
:root[data-theme="dark"]{
  --bg:#15171B;--surface:#1D2025;--surface2:#262A30;--line:#2E333A;--text:#F1EDE6;--text2:#A6A29B;--text3:#86827B;
  --accentText:#E9A24A;--accentTint:#2A2418;--record:#F2543F;--btn:#F1EDE6;--btnText:#15171B;
  --blue:#8FB7D6;--blueTint:rgba(143,183,214,.14);--dead:#F2543F;--shadow:0 8px 24px rgba(0,0,0,.25);--shadowL:0 30px 80px rgba(0,0,0,.5);
  --film:#1D2025;--filmSurface:#262A30;--filmLine:#353A42;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--pad)}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.stuck{border-bottom-color:var(--line)}
.hdr .wrap{height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:26px;margin-left:28px;font-size:15px;font-weight:500;color:var(--text2)}
.nav a{text-decoration:none;white-space:nowrap}.nav a:hover{color:var(--text)}
.hdr .sp{flex:1}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700;letter-spacing:.04em}
.seg button{height:28px;min-width:38px;padding:0 10px;border-radius:999px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(22,24,29,.12)}
.icb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text2);border:1px solid var(--line);background:var(--surface)}
.icb svg{width:18px;height:18px}
.icb .moon{display:none}[data-theme="dark"] .icb .moon{display:block}[data-theme="dark"] .icb .sun{display:none}
.cta{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--btn);color:var(--btnText);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
@media(max-width:860px){.nav{display:none}}
@media(max-width:520px){.hdr .cta{display:none}.hdr .wrap{gap:10px}}

/* ---------- shared scene language (from the ad) ---------- */
.slate{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.slate b{color:var(--accentText);font-weight:700}
.slate .new{margin-left:6px;padding:3px 10px;border-radius:999px;background:var(--accentTint);color:var(--accentText);letter-spacing:.08em;font-size:12px}
.hl{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;line-height:1.06;font-size:clamp(42px,6.4vw,96px);margin-top:18px}
.hl .ln{display:block}
.hl .am{color:var(--accentText);font-style:italic}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .06em .2em;margin:-.1em -.06em -.2em}
.wi{display:inline-block}
.lede{font-size:clamp(17px,1.5vw,20px);color:var(--text2);max-width:34em;margin-top:22px}
.js .w .wi{transform:translateY(120%);transition:transform .9s var(--ease);transition-delay:calc(var(--i,0) * 70ms + var(--d,0ms))}
.js .in .w .wi,.js .w.in .wi{transform:none}
.js .rise{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .9s var(--ease);transition-delay:var(--d,0ms)}
.js .in .rise,.js .in.rise{opacity:1;transform:none}
.js .wr{clip-path:inset(-8% 104% -8% -2%);transition:clip-path .6s cubic-bezier(.65,0,.35,1);transition-delay:calc(var(--i,0) * 110ms + 350ms)}
.js .in .wr{clip-path:inset(-8% -2% -8% -2%)}
.scene{padding:clamp(72px,13vh,150px) 0;position:relative}
.film{background:var(--film);color:var(--filmText);--text:var(--filmText);--text2:var(--filmText2);--text3:var(--filmText3);--accentText:#E9A24A;--line:var(--filmLine);--surface:var(--filmSurface)}
.film::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 560px at 82% 0%,rgba(233,162,74,.13),transparent 62%),radial-gradient(800px 600px at 0% 100%,rgba(143,183,214,.07),transparent 60%)}
.film>.wrap{position:relative}
.two .hl{font-size:clamp(40px,4.7vw,70px)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:center}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.points{list-style:none;margin-top:28px;display:grid;gap:16px;max-width:34em}
.points li{position:relative;padding-left:26px;color:var(--text2)}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.points b{color:var(--text);font-weight:600}

/* ---------- hero ---------- */
.hero{padding:clamp(20px,4vh,44px) 0 clamp(56px,9vh,100px)}
.hero .top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:end}
.hero h1{font-size:clamp(38px,4.5vw,64px);margin-top:12px}
.hero .side p{font-size:clamp(16px,1.25vw,18px);color:var(--text2);max-width:32em}
.hero .acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:20px}
.store{display:inline-flex;flex-direction:column;justify-content:center;height:54px;padding:0 22px;border-radius:14px;background:var(--btn);color:var(--btnText);text-decoration:none;line-height:1.1;transition:transform .25s var(--ease)}
.store:hover{transform:translateY(-2px)}
.store small{font-size:11px;font-weight:600;letter-spacing:.02em}
.store b{font-size:21px;font-weight:600;letter-spacing:-.01em}
.more{font-size:15px;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap}
.more:hover{color:var(--text)}
@media(max-width:900px){.hero .top{grid-template-columns:1fr;align-items:start}}

.player{margin:clamp(24px,4vh,40px) auto 0;width:min(100%,max(640px,calc((100vh - 400px) * 16 / 9)))}
.screen{position:relative;aspect-ratio:16/9;border-radius:clamp(14px,2vw,26px);overflow:hidden;background:#15171B;box-shadow:var(--shadowL);border:1px solid var(--line)}
.screen video,.screen iframe,.screen .poster{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover;background:#15171B}
.screen .poster{pointer-events:none;opacity:0;transition:opacity .3s}
.screen.cover .poster{opacity:1}
.bigplay{position:absolute;inset:0;display:none;place-items:center;background:rgba(21,23,27,.28)}
.screen.cover .bigplay{display:grid}
.bigplay span{width:92px;height:92px;border-radius:50%;background:#E0432F;display:grid;place-items:center;box-shadow:0 18px 50px rgba(224,67,47,.5);transition:transform .25s var(--ease)}
.bigplay:hover span{transform:scale(1.07)}
.bigplay svg{width:34px;height:34px;color:#fff;margin-left:5px}
.pbar{display:flex;align-items:flex-start;gap:12px;margin-top:14px}
.pbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.pbtn svg{width:16px;height:16px}
.pbtn .i-play{display:none}.player.paused .pbtn .i-play{display:block}.player.paused .pbtn .i-pause{display:none}
.chs{flex:1;display:flex;gap:5px;list-style:none;min-width:0;padding-top:6px}
.chs li{min-width:0}
.chs button{display:block;width:100%;text-align:left;padding:10px 0 4px}
.chs .trk{display:block;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.chs .fill{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%}
.chs .lb{display:block;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.chs .on .lb{color:var(--text)}
.tc{flex:none;padding-top:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text3);white-space:nowrap}
@media(max-width:720px){
  .player{width:min(100%,calc(74vh * 9 / 16))}
  .screen{aspect-ratio:9/16}
  .chs .lb{display:none}.chs button{padding:10px 0}
  .tc{display:none}
}

/* ---------- 01 record ---------- */
.stage{position:relative;aspect-ratio:1/1;max-width:540px;width:100%;margin-inline:auto;border-radius:32px;background:#15171B;color:#F1EDE6;overflow:hidden;box-shadow:var(--shadowL);border:1px solid var(--line)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 80% 0%,rgba(233,162,74,.16),transparent 65%)}
.island{position:absolute;left:50%;top:7%;transform:translateX(-50%);height:44px;min-width:128px;padding:0 16px;border-radius:22px;background:#000;border:1px solid #2E333A;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;transition:min-width .6s var(--ease),padding .6s var(--ease)}
.island .d{width:10px;height:10px;border-radius:50%;background:#5a5f68;transition:background .3s}
.island .lbl{color:#A6A29B;white-space:nowrap}
.island .mini{display:flex;align-items:center;gap:3px;height:18px;margin-left:auto;opacity:0;transition:opacity .3s}
.island .mini i{width:3px;height:100%;border-radius:2px;background:#E9A24A;transform:scaleY(.3)}
.stage.rec .island{min-width:212px}
.stage.rec .island .d{background:#F2543F;animation:blink 1.1s ease-in-out infinite}
.stage.rec .island .lbl{color:#F1EDE6}
.stage.rec .island .mini{opacity:1}
.stage.rec .island .mini i{animation:bar .7s ease-in-out infinite alternate}
.island .mini i:nth-child(2){animation-delay:-.2s}.island .mini i:nth-child(3){animation-delay:-.45s}.island .mini i:nth-child(4){animation-delay:-.1s}.island .mini i:nth-child(5){animation-delay:-.33s}
.recbtn{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center}
.recbtn::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(241,237,230,.2)}
.recbtn::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #F2543F;opacity:0}
.stage:not(.rec) .recbtn::after{animation:ripple 2.2s var(--ease) infinite}
.recbtn i{display:block;width:76%;height:76%;border-radius:50%;background:#F2543F;box-shadow:0 20px 60px rgba(242,84,63,.45);transition:width .45s var(--ease),height .45s var(--ease),border-radius .45s var(--ease),transform .15s}
.recbtn:active i{transform:scale(.93)}
.stage.rec .recbtn i{width:34%;height:34%;border-radius:22%}
.hint{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:15px;font-weight:600;color:#A6A29B;letter-spacing:.02em}
.watch{position:absolute;right:6%;bottom:6%;width:21%;aspect-ratio:416/496;border-radius:26%/22%;background:#000;border:3px solid #3a3f47;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10%;font-size:clamp(11px,1.3vw,15px);font-weight:600;font-variant-numeric:tabular-nums}
.watch::after{content:"";position:absolute;right:-9px;top:26%;width:6px;height:20%;border-radius:3px;background:#3a3f47}
.watch i{width:38%;aspect-ratio:1;border-radius:50%;background:#F2543F;transition:border-radius .4s var(--ease),transform .4s var(--ease)}
.stage.rec .watch i{border-radius:26%;transform:scale(.7)}
@keyframes blink{50%{opacity:.25}}
@keyframes bar{to{transform:scaleY(1)}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(1.55);opacity:0}}

/* ---------- 02 transcribe ---------- */
.wave{display:flex;align-items:center;justify-content:space-between;height:clamp(90px,14vw,170px);margin-top:clamp(36px,6vh,64px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.wave i{display:block;width:clamp(3px,.62vw,9px);height:100%;border-radius:99px;background:#E9A24A;transform:scaleY(var(--h,.2));animation:wv var(--t,1s) ease-in-out var(--dl,0s) infinite alternate;animation-play-state:paused}
.in .wave i{animation-play-state:running}
@keyframes wv{to{transform:scaleY(var(--h2,.6))}}
.tr{margin-top:clamp(28px,5vh,52px);display:grid;gap:clamp(14px,2vw,22px);font-size:clamp(19px,2.5vw,34px);line-height:1.4;font-weight:500}
.tr .row{display:grid;grid-template-columns:clamp(96px,11vw,150px) 1fr;gap:14px;align-items:baseline}
.tr .who{display:flex;align-items:center;gap:9px;font-size:clamp(12px,1.1vw,15px);font-weight:700;letter-spacing:.05em;color:var(--filmText2);white-space:nowrap}
.tr .who::before{content:"";width:10px;height:10px;border-radius:50%;background:#E9A24A}
.tr .who.b::before{background:var(--filmBlue)}
.tr .tag{display:inline-block;vertical-align:.25em;margin:0 .45em 0 .1em;padding:0 .5em;border-radius:.45em;font-size:.48em;line-height:1.7;font-weight:700;letter-spacing:.08em;border:1.5px solid #E9A24A;color:#E9A24A}
.tr .tag.en{border-color:var(--filmBlue);color:var(--filmBlue)}
.js .tr .tw{opacity:0;transition:opacity .35s ease;transition-delay:calc(var(--i) * 55ms + 500ms)}
.js .in .tr .tw{opacity:1}
@media(max-width:600px){.tr .row{grid-template-columns:1fr;gap:2px}}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,56px);margin-top:clamp(40px,7vh,72px);padding-top:clamp(28px,4vh,40px);border-top:1px solid var(--line)}
.duo h3,.notes h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;font-size:clamp(22px,2vw,28px);line-height:1.2}
.duo p,.notes p{margin-top:8px;color:var(--text2);font-size:16px}
@media(max-width:600px){.duo{grid-template-columns:1fr}}

/* ---------- 03 recap ---------- */
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pill{position:relative;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:19px;font-size:15px;font-weight:600;color:var(--accentText);background:var(--accentTint);border:1px solid var(--accent)}
.pill svg{width:16px;height:16px}
.js .pill{opacity:.0;transform:scale(.9);transition:opacity .35s,transform .5s var(--ease);transition-delay:calc(var(--i) * 620ms + 900ms)}
.js .in .pill{opacity:1;transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.rc{padding:clamp(22px,2.6vw,34px);max-width:560px;width:100%;margin-inline:auto;box-shadow:var(--shadowL)}
.rc .meta{font-size:13px;color:var(--text3)}
.rc .title{font-size:clamp(28px,2.8vw,36px);line-height:1.2;margin-top:2px}
.rc .lab{margin-top:18px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--text3)}
.rc .sum{margin-top:6px;font-size:16px;line-height:1.5}
.rc .li{margin-top:6px;padding-left:18px;position:relative;font-size:16px;font-weight:500;line-height:1.4}
.rc .li::before{content:"";position:absolute;left:1px;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.rc .task{margin-top:9px;display:flex;gap:11px;align-items:flex-start}
.rc .box{flex:none;margin-top:2px;width:19px;height:19px;border-radius:6px;border:1.8px solid var(--text3)}
.rc .t{font-size:16px;font-weight:600;line-height:1.3}
.rc .m{font-size:13px;color:var(--text2)}.rc .m b{color:var(--dead);font-weight:600}
.rc .drow{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 11px;font-size:16px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:9px;background:var(--blueTint);color:var(--blue);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.badge svg{width:14px;height:14px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,24px);margin-top:clamp(48px,8vh,88px)}
.notes .card{padding:24px}
.notes .q{margin-top:14px;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--surface2);font-size:15px;font-weight:500}
.notes .a{margin-top:8px;padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--accentTint);font-size:15px;font-weight:500}
.notes .a b{color:var(--accentText);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
@media(max-width:900px){.notes{grid-template-columns:1fr}}

/* ---------- 04 calendar ---------- */
.calwrap{position:relative;max-width:520px;width:100%;margin-inline:auto}
.cal{padding:clamp(18px,2.4vw,28px);box-shadow:var(--shadowL)}
.cal .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal .month{font-size:clamp(24px,2.6vw,32px)}
.cal .sg{display:flex;padding:3px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--text2)}
.cal .sg span{padding:0 13px;height:27px;line-height:27px;border-radius:99px}
.cal .sg span:first-child{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(22,24,29,.12)}
.cal .wd,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wd{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text3)}
.cal .cell{position:relative;height:clamp(40px,5.4vw,52px);display:grid;place-items:center;font-size:clamp(15px,1.5vw,18px);font-weight:500;font-variant-numeric:tabular-nums}
.cal .hit{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:var(--blue);color:var(--surface);display:grid;place-items:center;font-weight:700;box-shadow:0 8px 20px rgba(58,110,154,.35)}
.js .cal .hit{transform:scale(0);transition:transform .6s cubic-bezier(.34,1.8,.64,1);transition-delay:calc(var(--i) * 450ms + 700ms)}
.js .in .cal .hit{transform:none}
.cal .list{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.cal .ev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 0;font-size:15.5px;font-weight:600}
.cal .ev .bell{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap}
.cal .ev .bell svg{width:15px;height:15px;color:var(--accent)}
.toast{position:absolute;right:-10px;bottom:-36px;height:46px;padding:0 20px 0 16px;border-radius:23px;background:var(--btn);color:var(--btnText);display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 14px 34px rgba(22,24,29,.3)}
.toast svg{width:18px;height:18px;color:var(--accent)}
.js .toast{opacity:0;transform:translateY(16px) scale(.7);transition:opacity .3s,transform .6s cubic-bezier(.34,1.6,.64,1);transition-delay:1.9s}
.js .in .toast{opacity:1;transform:none}
@media(max-width:560px){.toast{right:8px}}

/* ---------- 05 private ---------- */
.priv{text-align:center}
.priv .slate{justify-content:center}
.priv .hl{font-size:clamp(52px,10vw,150px)}
.priv .lede{margin-inline:auto}
.priv .chips{justify-content:center;margin-top:30px}
.priv .chip{height:38px;padding:0 16px;border-radius:19px;font-size:15px;background:var(--filmSurface);border-color:var(--filmLine);gap:8px}
.priv .chip svg{width:16px;height:16px;color:#E9A24A}

/* ---------- plans ---------- */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,22px);margin-top:clamp(36px,6vh,60px)}
.plan{padding:clamp(22px,2.4vw,32px);display:flex;flex-direction:column}
.plan.hot{border-color:var(--accent);box-shadow:var(--shadowL)}
.plan .nm{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.plan .price{margin-top:14px;font-size:clamp(44px,4.6vw,62px);line-height:1}
.plan .per{margin-top:6px;font-size:15px;color:var(--text2);min-height:1.5em}
.plan ul{list-style:none;margin-top:20px;display:grid;gap:11px;font-size:16px}
.plan li{position:relative;padding-left:28px}
.plan li svg{position:absolute;left:0;top:3px;width:18px;height:18px;color:var(--accentText)}
.fine{margin-top:22px;font-size:13.5px;color:var(--text3);max-width:60em}
@media(max-width:900px){.plans{grid-template-columns:1fr}}

/* ---------- end card ---------- */
.end{text-align:center;padding-bottom:clamp(40px,6vh,64px)}
.end .mark{width:clamp(96px,11vw,150px);height:auto;overflow:visible}
.end .mark rect,.end .mark circle{transform-box:fill-box;transform-origin:50% 50%}
.js .end .mark rect{transform:scaleY(0);transition:transform .8s cubic-bezier(.34,1.7,.64,1);transition-delay:calc(var(--i) * 80ms)}
.js .end .mark circle{transform:scale(0);transition:transform .6s cubic-bezier(.34,2,.64,1);transition-delay:.5s}
.js .end.in .mark rect,.js .end.in .mark circle{transform:none}
.end .name{font-size:clamp(64px,11vw,160px);line-height:1.05;margin-top:8px}
.end .tagl{font-size:clamp(18px,2.2vw,30px);color:var(--filmText2);margin-top:6px}
.end .store{margin-top:34px;height:68px;padding:0 30px;border-radius:17px;background:#F1EDE6;color:#15171B;text-align:left}
.end .store small{font-size:13px}.end .store b{font-size:28px}
.end .sub{margin-top:18px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--filmText3)}
.foot{margin-top:clamp(56px,9vh,96px);padding-top:22px;border-top:1px solid var(--filmLine);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;font-size:14px;color:var(--filmText2)}
.foot a{text-decoration:none}.foot a:hover{color:var(--filmText)}

#prog{position:fixed;left:0;bottom:0;z-index:60;width:100%;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;pointer-events:none}

/* reduced motion: JS adds .still when prefers-reduced-motion is set (or ?still=1) — everything readable, nothing moves */
html.still{scroll-behavior:auto}
.still .w .wi,.still .rise,.still .wr,.still .tr .tw,.still .pill,.still .cal .hit,.still .toast,.still .end .mark rect,.still .end .mark circle{transition:none!important;transform:none!important;opacity:1!important;clip-path:none!important}
.still .wave i,.still .stage .island .d,.still .stage .island .mini i,.still .recbtn::after,.still .recbtn i,.still .island{animation:none!important;transition:none!important}
.still .store,.still .bigplay span{transition:none}
</style>
