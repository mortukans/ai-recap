# iOS build on GitHub's macOS runners using the EAS pipeline locally (`eas build --local`).
# Uses the EAS project's stored credentials + env vars, but does NOT consume EAS build quota.
#
# Submission to TestFlight:
#   • If the App Store Connect API key secrets are set (ASC_API_KEY_ID / ASC_API_ISSUER_ID /
#     ASC_API_KEY_BASE64), the build uploads DIRECTLY to Apple with `xcrun altool` — no EAS Submit
#     queue (which cost ~3 h on the free tier). This is the fast path.
#   • Otherwise it falls back to EAS Submit (free-tier queue).
#
# Trigger: Actions → "iOS build" → Run workflow. Requires repo secret EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). See docs/CI_DIRECT_UPLOAD.md to enable the fast path.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        default: production
        options: [production, preview, development]
      submit:
        description: Submit to TestFlight after building (production only)
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: eas build --local (${{ inputs.profile }})
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Faster, deterministic installs on the runner.
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (version from package.json "packageManager")
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (.ipa)
        working-directory: apps/mobile
        run: |
          eas build --platform ios --profile "${{ inputs.profile }}" --local --non-interactive --output "$RUNNER_TEMP/AIRecap.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRecap-${{ inputs.profile }}-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/AIRecap.ipa
          retention-days: 14

      - name: Submit to TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        timeout-minutes: 25
        working-directory: apps/mobile
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ASC_API_KEY_ID:-}" ] && [ -n "${ASC_API_ISSUER_ID:-}" ] && [ -n "${ASC_API_KEY_BASE64:-}" ]; then
            echo "Uploading directly to App Store Connect with altool (no EAS Submit queue)."
            KEYDIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEYDIR"
            KEYFILE="$KEYDIR/AuthKey_${ASC_API_KEY_ID}.p8"
            echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEYFILE"
            trap 'rm -f "$KEYFILE"' EXIT
            # --upload-app returns as soon as the binary is accepted; Apple then processes it (a few min),
            # visible in App Store Connect → TestFlight. No long-poll, so the step can't hang.
            xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/AIRecap.ipa" \
              --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          else
            echo "ASC API key secrets not set — falling back to EAS Submit (free-tier queue)."
            # --no-wait: the upload is what matters; Apple's processing status is visible in App Store Connect.
            eas submit --platform ios --profile production --path "$RUNNER_TEMP/AIRecap.ipa" --non-interactive --no-wait
          fi
