packages:
  - apps/*
  - packages/*
  - modules/*
allowBuilds:
  esbuild: true
  # Pulled in via expo-widgets/@expo/ui; pnpm 11 fails EAS installs on unapproved build scripts.
  unrs-resolver: true
# Force a single expo version across the workspace so the local native module (modules/recorder)
# doesn't pull a duplicate expo tree (expo-doctor duplicate-native-module check).
overrides:
  expo: ~57.0.22
